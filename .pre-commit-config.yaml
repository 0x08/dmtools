# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
---
repos:
  # --- UNIVERSAL SANITY CHECKS ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0  # Use the latest stable version
    hooks:
      - id: trailing-whitespace
        description: Trims trailing whitespace from all edited files.
      - id: end-of-file-fixer
        description: Ensures files end with a newline character.
      - id: check-yaml
        description: Validates the syntax of YAML files (like this config!).
      - id: check-added-large-files
        description: Prevents giant asset files from accidentally being committed.

  # --- CODE FORMATTING (HTML & MARKDOWN) ---
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        # Targets both HTML and Markdown files for automatic code formatting
        types_or: [html, markdown, json]
        # Optional: Add flags if you want to override default Prettier behavior
        # args: [--prose-wrap=always, --print-width=80]

  # --- MARKDOWN QUALITY LINTING ---
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        description: Checks Markdown files for structural and style rules.
        # Optional: If you want to ignore certain rules (like line length)
        # args: [--disable, MD013]
